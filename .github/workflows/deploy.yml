# Despliegue en el homelab a través del runner self-hosted de docker01.
#
# - Lo llama ci.yml (dev, staging, prod) o se lanza a mano para un ROLLBACK:
#   Actions -> Deploy -> Run workflow -> entorno + versión anterior (p. ej. 0.2.0).
# - Puerta de política: solo se despliega una imagen firmada por ci.yml de este repo,
#   y prod solo acepta versiones finales (sin sufijo -alpha/-rc).
# - Si el smoke test falla, vuelve automáticamente a la imagen que estaba corriendo.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno
        type: choice
        options: [dev, staging, prod]
        required: true
      version:
        description: Versión (tag de imagen) a desplegar, p. ej. 0.2.0
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: ${{ inputs.environment }} ← ${{ inputs.version }}
    runs-on: [self-hosted, homelab-deploy]
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'prod' && 'https://lab.elpalmeral.es/docs' || format('https://lab-{0}.elpalmeral.es/docs', inputs.environment) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      LAB_ENV: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      CONTAINER: lab-${{ inputs.environment }}-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy

      - name: Política de versiones por entorno
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' no es SemVer"; exit 1
          fi
          if [[ "$LAB_ENV" == "prod" && "$VERSION" == *-* ]]; then
            echo "::error::prod solo admite versiones finales; '$VERSION' es una pre-release"; exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: verify
        name: Verificar firma (cosign keyless) y resolver digest
        run: |
          cosign verify "$IMAGE:$VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/heads/(develop|main|release/.+|hotfix/.+)$" \
            --output json > verify.json
          digest=$(jq -r '.[0].critical.image."docker-manifest-digest"' verify.json)
          signer=$(jq -r '.[0].optional.Subject // .[0].optional.subject // "?"' verify.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "✅ Firma válida para \`$IMAGE:$VERSION\` → \`$digest\` (firmado por \`$signer\`)" >> "$GITHUB_STEP_SUMMARY"

      - id: prev
        name: Guardar versión actual (para rollback)
        run: |
          if docker inspect "$CONTAINER" > /dev/null 2>&1; then
            image=$(docker inspect "$CONTAINER" --format '{{.Config.Image}}')
            version=$(docker inspect "$CONTAINER" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^APP_VERSION=//p')
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Versión anterior en $LAB_ENV: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: docker compose up
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.verify.outputs.digest }}
          APP_VERSION: ${{ env.VERSION }}
        run: |
          docker compose -p "lab-$LAB_ENV" -f deploy/compose.yaml --env-file "deploy/env/$LAB_ENV.env" \
            up -d --pull always --wait --wait-timeout 90

      - name: Smoke test
        run: |
          docker exec -i "$CONTAINER" python - "$VERSION" <<'EOF'
          import json, sys, urllib.request
          base = "http://127.0.0.1:8000"
          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, method=method,
                                           headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=5) as r:
                  return r.status, (json.loads(r.read() or b"null"))
          status, v = call("GET", "/version")
          assert v["version"] == sys.argv[1], f"versión servida {v['version']} != {sys.argv[1]}"
          status, item = call("POST", "/items", {"name": "smoke", "quantity": 1})
          assert status == 201, status
          assert call("DELETE", f"/items/{item['id']}")[0] == 204
          print("smoke OK", json.dumps(v))
          EOF
          echo "### 🚀 \`$LAB_ENV\` sirve \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback automático
        if: failure() && steps.prev.outputs.image != ''
        env:
          IMAGE_REF: ${{ steps.prev.outputs.image }}
          APP_VERSION: ${{ steps.prev.outputs.version }}
        run: |
          echo "::error::Despliegue de $VERSION fallido; volviendo a $APP_VERSION"
          docker compose -p "lab-$LAB_ENV" -f deploy/compose.yaml --env-file "deploy/env/$LAB_ENV.env" \
            up -d --wait --wait-timeout 90
          echo "### ⏪ Rollback a \`$APP_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Logout
        if: always()
        run: docker logout ghcr.io || true
