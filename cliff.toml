# git-cliff: notas de versión a partir de Conventional Commits.
[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Sin publicar{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}⚠️ **BREAKING** {% endif %}{{ commit.message | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Funcionalidades" },
  { message = "^fix", group = "<!-- 1 -->🐛 Correcciones" },
  { message = "^perf", group = "<!-- 2 -->⚡ Rendimiento" },
  { message = "^refactor", group = "<!-- 3 -->🧹 Refactor" },
  { message = "^docs", group = "<!-- 4 -->📝 Documentación" },
  { message = "^(build|ci)", group = "<!-- 5 -->🏗️ Build y CI" },
  { message = "^test", group = "<!-- 6 -->🧪 Tests" },
  { message = ".*", group = "<!-- 7 -->Otros" },
]
